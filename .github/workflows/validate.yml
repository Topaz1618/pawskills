name: validate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate skills and profiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Validate skill structure, frontmatter, and profiles
        run: python scripts/validate.py

      - name: Check internal links
        run: python scripts/check-links.py

      - name: Run the test suite
        run: python -m pip install --upgrade pytest && python -m pytest tests/ -v

      - name: Smoke test the installer
        run: |
          python scripts/install.py --list
          python scripts/install.py --agent codex --profile lightweight --dry-run --project-dir "$RUNNER_TEMP/project"
          python scripts/install.py --agent claude-code --profile lightweight --project-dir "$RUNNER_TEMP/project"
          python scripts/install.py --agent codex --profile lightweight --uninstall --project-dir "$RUNNER_TEMP/project"
